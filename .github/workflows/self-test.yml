name: Self Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every push fires 6 jobs; do not let stale runs pile up.
concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: report.mjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/report.test.mjs

  # Kept out of the matrix below: this one is about the copy step in action.yml,
  # not about the scanners. `reviews: commit-message` runs no SARIF scanner at
  # all, so the only finding in the report can be the style one.
  extra-sarif:
    name: extra-sarif
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A linter's SARIF, without needing the linter
        run: |
          cat > style.sarif <<'JSON'
          {"runs":[{"tool":{"driver":{"name":"Ruff"}},"results":[{
            "ruleId":"E501","level":"error","message":{"text":"Line too long"},
            "locations":[{"physicalLocation":{
              "artifactLocation":{"uri":"examples/fixtures/sqli.py"},
              "region":{"startLine":8}}}]}]}]}
          JSON

      # fail-on: critical with a level: error style finding — if style ever
      # started gating, or landed on the CVSS scale, this job goes red.
      - id: review
        uses: ./
        with:
          reviews: commit-message
          fail-on: critical
          extra-sarif: style.sarif

      - name: Assert
        env:
          DIR: ${{ steps.review.outputs.report-dir }}
        run: |
          set -euo pipefail
          report="$DIR/review-report.md"
          grep -qF '### Coding Standard (1)' "$report" \
            || { echo "::error::the style finding never reached the report"; exit 1; }
          grep -qF '| **Total** | **0** |' "$report" \
            || { echo "::error::a style finding must stay off the CVSS table"; exit 1; }

      # A path that matches nothing is a broken pipeline, not an empty result.
      - id: missing
        continue-on-error: true
        uses: ./
        with:
          reviews: commit-message
          extra-sarif: no-such-file-*.sarif

      - if: steps.missing.outcome != 'failure'
        run: |
          echo "::error::extra-sarif matching no file must fail the run"
          exit 1

  integration:
    name: ${{ matrix.reviews }} @ ${{ matrix.fail-on }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every review enabled: the fixtures trigger findings across bands.
          - reviews: code,vulnerability,commit-message
            fail-on: high
            expect: fail
          # code only: the secret finding must disappear from the report.
          # The gate is `info`, not `high`: the band Semgrep assigns to the
          # fixtures is decided by its registry rules, not by this repo, so
          # pinning it to High would make the test depend on something we do
          # not control. All we want to prove is "the gate catches findings".
          - reviews: code
            fail-on: info
            expect: fail
          # vulnerability only, strictest gate: the fake secret is Critical.
          - reviews: vulnerability
            fail-on: critical
            expect: fail
          # Gate off: must pass, but the report is still produced.
          - reviews: code,vulnerability
            fail-on: none
            expect: pass
          # A typo must fail loudly rather than be silently skipped.
          - reviews: bogus
            fail-on: high
            expect: fail
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: review
        continue-on-error: true
        uses: ./
        with:
          reviews: ${{ matrix.reviews }}
          fail-on: ${{ matrix.fail-on }}
          # The fixtures are never in a pull request's diff, so the default
          # scope would scope every expected finding away and turn the whole
          # matrix green. This suite tests the scanners, not the scoping.
          scope: all

      - name: Assert
        env:
          OUTCOME: ${{ steps.review.outcome }}
          EXPECTED: ${{ matrix.expect }}
          REVIEWS: ${{ matrix.reviews }}
          FAIL_ON: ${{ matrix.fail-on }}
          DIR: ${{ steps.review.outputs.report-dir }}
        run: |
          set -euo pipefail

          # Number of results inside a SARIF file.
          results() {
            node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
              console.log((d.runs||[]).reduce((a,r)=>a+(r.results||[]).length,0));' "$1"
          }
          # A fixture that stops triggering a scanner must be diagnosed as
          # exactly that, not masquerade as "the gate is broken". Hence the
          # content checks run before the pass/fail comparison.
          expect_findings() {
            [ -s "$1" ] || { echo "::error::$(basename "$1") is missing or empty"; exit 1; }
            n="$(results "$1")"
            echo "$(basename "$1"): $n results"
            [ "$n" -gt 0 ] || { echo "::error::fixtures no longer trigger $(basename "$1" .sarif)"; exit 1; }
          }

          # Lego: a SARIF file may only exist for a review that was requested.
          if [ -n "$DIR" ]; then
            case "$REVIEWS" in
              *vulnerability*)
                expect_findings "$DIR/gitleaks.sarif"
                # Trivy is deliberately checked for presence only: fetching its
                # CVE database depends on the network/registry, so demanding
                # findings here would make the test flaky for reasons outside
                # this repo.
                [ -s "$DIR/trivy.sarif" ] || { echo "::error::trivy.sarif is missing"; exit 1; } ;;
              *)
                [ ! -f "$DIR/gitleaks.sarif" ] || { echo "::error::gitleaks ran without being requested"; exit 1; } ;;
            esac
            case "$REVIEWS" in
              *code*)
                expect_findings "$DIR/semgrep.sarif" ;;
              *)
                [ ! -f "$DIR/semgrep.sarif" ] || { echo "::error::semgrep ran without being requested"; exit 1; } ;;
            esac
            case "$REVIEWS" in
              *commit-message*)
                # commit.txt is always written, and is empty when every message
                # passes. So presence is what we assert — without this check
                # commitlint could die silently while the matrix row stays green
                # on another scanner's findings.
                [ -f "$DIR/commit.txt" ] || { echo "::error::commit.txt is missing, commitlint did not run"; exit 1; } ;;
              *)
                [ ! -f "$DIR/commit.txt" ] || { echo "::error::commitlint ran without being requested"; exit 1; } ;;
            esac
          fi

          if [ "$OUTCOME" = "success" ]; then got=pass; else got=fail; fi
          if [ "$got" != "$EXPECTED" ]; then
            echo "::error::'$REVIEWS' @ fail-on=$FAIL_ON should be $EXPECTED, got $got"
            exit 1
          fi

      # This integration test cannot be run locally, so when an assert fails the
      # raw SARIF must be downloadable for inspection. It has to come after
      # Assert: the review step is already continue-on-error, so before this
      # point failure() never fires.
      - name: Upload raw SARIF on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ strategy.job-index }}
          path: ${{ steps.review.outputs.report-dir }}
          if-no-files-found: ignore
