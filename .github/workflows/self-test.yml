name: Self Test

on:
  # Branches are covered by pull_request; without this filter a PR branch runs
  # the whole matrix twice on every push.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every push fires 8 jobs; do not let stale runs pile up.
concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit + shellcheck
    runs-on: ubuntu-latest
    # A hung job would otherwise run for the 6 hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/report.test.mjs
      - run: node scripts/jscpd-to-sarif.test.mjs
      - run: bash scripts/steps.test.sh
      - run: node scripts/gitlab-ci.test.mjs
      # The extracted shell is where the bugs have been, so it gets a static
      # pass on top of its own tests.
      - run: shellcheck scripts/*.sh

  # Out of the matrix: this is about the copy step, not the scanners.
  # `reviews: commit-message` runs no SARIF scanner, so the only finding in the
  # report can be the style one.
  extra-sarif:
    name: extra-sarif
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: A linter's SARIF, without needing the linter
        run: |
          cat > style.sarif <<'JSON'
          {"runs":[{"tool":{"driver":{"name":"Ruff"}},"results":[{
            "ruleId":"E501","level":"error","message":{"text":"Line too long"},
            "locations":[{"physicalLocation":{
              "artifactLocation":{"uri":"examples/fixtures/risky.py"},
              "region":{"startLine":8}}}]}]}]}
          JSON

      # fail-on: critical with a level: error style finding — if style ever
      # started gating, this job goes red.
      - id: review
        uses: ./
        with:
          reviews: commit-message
          fail-on: critical
          extra-sarif: style.sarif
          # The fixture is never in a diff, so the default scope would hide the
          # one finding this job looks for.
          scope: all
          # Smoke test for the upload step: a bad path fails here, not at a
          # consumer.
          upload-artifact: extra-sarif-report

      - name: Assert
        env:
          DIR: ${{ steps.review.outputs.report-dir }}
        run: |
          set -euo pipefail
          report="$DIR/review-report.md"
          grep -qF '### Coding Standard (1)' "$report" \
            || { echo "::error::the style finding never reached the report"; exit 1; }
          grep -qF '| **Total** | **0** |' "$report" \
            || { echo "::error::a style finding must stay off the CVSS table"; exit 1; }

      # A path that matches nothing is a broken pipeline, not an empty result.
      - id: missing
        continue-on-error: true
        uses: ./
        with:
          reviews: commit-message
          extra-sarif: no-such-file-*.sarif

      - if: steps.missing.outcome != 'failure'
        run: |
          echo "::error::extra-sarif matching no file must fail the run"
          exit 1

  integration:
    name: ${{ matrix.reviews }} @ ${{ matrix.fail-on }}${{ matrix.os && ' (arm64)' || '' }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    # Installs and runs three real scanners, so it gets the longest leash.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every review enabled: the fixtures trigger findings across bands.
          - reviews: code,vulnerability,commit-message
            fail-on: high
            expect: fail
          # code only: the secret finding must disappear from the report.
          # The gate is `info`, not `high`: the band Semgrep assigns comes from
          # its registry rules, not from this repo. All this proves is that the
          # gate catches findings.
          - reviews: code
            fail-on: info
            expect: fail
          # vulnerability only, strictest gate: the fake secret is Critical.
          - reviews: vulnerability
            fail-on: critical
            expect: fail
          # Gate off: must pass, but the report is still produced.
          - reviews: code,vulnerability
            fail-on: none
            expect: pass
          # A typo must fail loudly rather than be silently skipped.
          - reviews: bogus
            fail-on: high
            expect: fail
          # arm64: every scanner is a per-architecture download.
          - reviews: code,vulnerability
            fail-on: info
            expect: fail
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: review
        continue-on-error: true
        uses: ./
        with:
          reviews: ${{ matrix.reviews }}
          fail-on: ${{ matrix.fail-on }}
          # The fixtures are never in a diff, so the default scope would hide
          # every expected finding. This suite tests the scanners.
          scope: all

      - name: Assert
        env:
          OUTCOME: ${{ steps.review.outcome }}
          EXPECTED: ${{ matrix.expect }}
          REVIEWS: ${{ matrix.reviews }}
          FAIL_ON: ${{ matrix.fail-on }}
          DIR: ${{ steps.review.outputs.report-dir }}
        run: |
          set -euo pipefail

          # Number of results a SARIF file places in the fixtures. Only those:
          # Semgrep also flags this repo's own workflows, which kept this
          # assert green after the registry rules had stopped matching the
          # fixture.
          results() {
            node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
              const at=(x)=>x.locations?.[0]?.physicalLocation?.artifactLocation?.uri??"";
              console.log((d.runs||[]).flatMap((r)=>r.results||[]).filter((x)=>at(x).includes("examples/fixtures/")).length);' "$1"
          }
          # Content checks run first so a fixture that stopped triggering a
          # scanner is not reported as a broken gate.
          expect_findings() {
            [ -s "$1" ] || { echo "::error::$(basename "$1") is missing or empty"; exit 1; }
            n="$(results "$1")"
            echo "$(basename "$1"): $n results"
            [ "$n" -gt 0 ] || { echo "::error::fixtures no longer trigger $(basename "$1" .sarif)"; exit 1; }
          }

          # Lego: a SARIF file may only exist for a review that was requested.
          if [ -n "$DIR" ]; then
            case "$REVIEWS" in
              *vulnerability*)
                expect_findings "$DIR/gitleaks.sarif"
                # Presence only: Trivy's CVE database comes over the network,
                # so demanding findings would make this flaky.
                [ -s "$DIR/trivy.sarif" ] || { echo "::error::trivy.sarif is missing"; exit 1; } ;;
              *)
                [ ! -f "$DIR/gitleaks.sarif" ] || { echo "::error::gitleaks ran without being requested"; exit 1; } ;;
            esac
            case "$REVIEWS" in
              *code*)
                expect_findings "$DIR/semgrep.sarif" ;;
              *)
                [ ! -f "$DIR/semgrep.sarif" ] || { echo "::error::semgrep ran without being requested"; exit 1; } ;;
            esac
            case "$REVIEWS" in
              *commit-message*)
                # commit.txt is always written and empty when every message
                # passes, so presence is the assertion — otherwise commitlint
                # could die silently while the row stays green.
                [ -f "$DIR/commit.txt" ] || { echo "::error::commit.txt is missing, commitlint did not run"; exit 1; } ;;
              *)
                [ ! -f "$DIR/commit.txt" ] || { echo "::error::commitlint ran without being requested"; exit 1; } ;;
            esac
          fi

          if [ "$OUTCOME" = "success" ]; then got=pass; else got=fail; fi
          if [ "$got" != "$EXPECTED" ]; then
            echo "::error::'$REVIEWS' @ fail-on=$FAIL_ON should be $EXPECTED, got $got"
            exit 1
          fi

      # Every row runs scope: all, so this is the only place the default scope
      # meets what the scanners really write. scopeTo matches paths exactly: a
      # uri spelled differently from git's drops the finding out of the gate.
      - name: Every finding survives scope changed
        if: matrix.reviews == 'code,vulnerability,commit-message'
        env:
          DIR: ${{ steps.review.outputs.report-dir }}
          GIT_AUTHOR_NAME: self-test
          GIT_AUTHOR_EMAIL: self-test@example.invalid
          GIT_COMMITTER_NAME: self-test
          GIT_COMMITTER_EMAIL: self-test@example.invalid
        run: |
          set -euo pipefail
          . scripts/steps.sh
          # A range in which every file is new: an empty base, and this very
          # tree on top of it. Nothing is checked out or pushed.
          base="$(git commit-tree -m base "$(git mktree < /dev/null)")"
          head="$(git commit-tree -m head -p "$base" 'HEAD^{tree}')"
          SCOPE=changed BASE="$base" HEAD="$head" changed_lines "$RUNNER_TEMP/changed.txt"
          # Not tied to the fixtures: which of them a registry ruleset still
          # flags is not this repo's to decide.
          # shellcheck disable=SC2016  # the ${} below is JavaScript's
          node --input-type=module -e '
            import { collect, readChanged, scopeTo } from "./scripts/report.mjs";
            const [dir, changed] = process.argv.slice(1);
            const all = collect(dir).findings;
            const kept = new Set(scopeTo(all, readChanged(changed)));
            const lost = all.filter((f) => !kept.has(f));
            for (const f of lost) console.log(`::error::scoped out: ${f.tool} at ${f.location}`);
            console.log(`${all.length} findings, ${lost.length} scoped out`);
            process.exitCode = lost.length || !all.length ? 1 : 0;
          ' "$DIR" "$RUNNER_TEMP/changed.txt"

      # Not runnable locally, so a failed assert has to leave the raw SARIF
      # downloadable. After Assert: the review step is continue-on-error, so
      # failure() never fires before this point.
      - name: Upload raw SARIF on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ strategy.job-index }}
          path: ${{ steps.review.outputs.report-dir }}
          # ignore here, warn inside action.yml: this only runs on a failed job,
          # where the review may have exited before the directory existed.
          if-no-files-found: ignore

  # The one check a ruleset requires: rows can be added or renamed without
  # touching it. always(), because a job skipped after a failed need counts as
  # passed; anything but success in every need, cancelled included, is red.
  self-test:
    name: self-test
    if: always()
    needs: [unit, extra-sarif, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::unit, extra-sarif, integration: ${{ join(needs.*.result, ', ') }}"
          exit 1
