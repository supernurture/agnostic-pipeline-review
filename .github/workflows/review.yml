# This repository reviewing itself the way a consumer would. self-test.yml
# proves the action works but never lets a finding block anything: every call
# there is continue-on-error and half the rows expect failure.
#
# Pull requests only — a gate belongs on the thing being merged.
name: Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# Three scanner installs per run: do not let pushes pile up.
concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs the commit range, `scope` both ends of the diff.
          fetch-depth: 0

      # `./`, not the published tag: a PR must be reviewed by the code it
      # proposes, not by the last release.
      - uses: ./
        with:
          reviews: code,vulnerability,commit-message
          fail-on: high
          # The default, spelled out because it does real work here:
          # examples/fixtures/ is full of deliberate secrets, and scoping to
          # the diff keeps them out of unrelated pull requests.
          scope: changed
          pr-comment: "true"
          upload-artifact: review-report
