version: 2
updates:
  # Action pins in action.yml and the workflows must not go stale: the scanner
  # versions shape the quality of the review.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
# Out of Dependabot's reach, bump by hand: the `semgrep-version` and
# `gitleaks-version` inputs in action.yml, and the `rev:` pins in
# presets/pre-commit.yaml. `trivy-version` and `commitlint-version` default to
# `latest`, so there is no pin to go stale.
#
# Dependabot rewrites .github/workflows/ and action.yml and nothing else, so
# the same `uses:` lines in README.md and examples/ — the two copies new users
# start from — fall behind on every bump. Grep and update them when a PR lands.
