version: 2
updates:
  # Pin action pihak ketiga di action.yml & workflow tidak boleh basi —
  # ini pipeline keamanan, versi scanner-nya ikut menentukan mutunya.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
# Catatan: input `semgrep-version` & `gitleaks-version` di action.yml tidak
# tersentuh Dependabot — keduanya versi biner yang diunduh sendiri, jadi
# naikkan manual. `rev:` di presets/pre-commit.yaml juga manual.
