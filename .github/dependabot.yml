version: 2
updates:
  # Third-party action pins in action.yml and the workflows must not go stale —
  # this is a security pipeline, and the scanner versions shape its quality.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
# Note: the `semgrep-version` and `gitleaks-version` inputs in action.yml are
# out of Dependabot's reach — both are self-downloaded binary versions, so bump
# them by hand. The `rev:` pins in presets/pre-commit.yaml are manual too.
