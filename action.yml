name: Agnostic Review Pipeline
description: Code, vulnerability, and commit message review with a CVSS-ranked severity report.
author: supernurture

inputs:
  reviews:
    description: "Enabled reviews, comma-separated: code, vulnerability, commit-message"
    required: true
  fail-on:
    description: "Lowest severity that fails the build: critical, high, medium, low, info, none"
    required: false
    default: high
  semgrep-config:
    description: "Semgrep ruleset (see semgrep.dev/r)"
    required: false
    default: p/ci
  # The engine version is pinned for reproducible results. The rules stay
  # fresh regardless: --config p/ci pulls the ruleset from the registry at run
  # time.
  semgrep-version:
    description: "Semgrep version to install"
    required: false
    default: "1.173.0"
  gitleaks-version:
    description: "Gitleaks version to download"
    required: false
    default: "8.30.1"
  # Trivy and commitlint default to `latest` on purpose: for those two the
  # version *is* the freshness — the CVE database and the rule defaults. Pin
  # them to reproduce an old run or to roll back a bad release.
  trivy-version:
    description: "Trivy version to install"
    required: false
    default: latest
  commitlint-version:
    description: "commitlint version to install"
    required: false
    default: latest
  scope:
    description: "Findings the gate looks at: changed (files in the PR diff) or all"
    required: false
    default: changed

outputs:
  report-dir:
    description: "Directory holding review-report.md and each scanner's raw SARIF"
    value: ${{ steps.parse.outputs.dir }}

runs:
  using: composite
  steps:
    # Review names are validated up front: a typo must fail loudly rather than
    # silently skip a review.
    - name: Validate requested reviews
      id: parse
      shell: bash
      env:
        REVIEWS: ${{ inputs.reviews }}
        SCOPE: ${{ inputs.scope }}
        REPORT_DIR: ${{ runner.temp }}/agnostic-review
      run: |
        set -euo pipefail
        if [ -z "$(echo "$REVIEWS" | tr -d '[:space:],')" ]; then
          echo "::error::input 'reviews' is empty (choices: code, vulnerability, commit-message)"
          exit 1
        fi
        case "$SCOPE" in
          changed|all) ;;
          *) echo "::error::unknown scope: '$SCOPE' (choices: changed, all)"; exit 1 ;;
        esac
        mkdir -p "$REPORT_DIR"
        expect=""
        for r in $(echo "$REVIEWS" | tr ',' ' '); do
          case "$r" in
            code)
              echo "run_code=true" >> "$GITHUB_OUTPUT"
              expect="$expect,semgrep.sarif" ;;
            vulnerability)
              echo "run_vuln=true" >> "$GITHUB_OUTPUT"
              expect="$expect,trivy.sarif,gitleaks.sarif" ;;
            commit-message)
              echo "run_commit=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::unknown review: '$r' (choices: code, vulnerability, commit-message)"
              exit 1 ;;
          esac
        done
        echo "expect=${expect#,}" >> "$GITHUB_OUTPUT"
        echo "dir=$REPORT_DIR" >> "$GITHUB_OUTPUT"
        echo "ok=true" >> "$GITHUB_OUTPUT"

    - name: Code review — Semgrep
      if: steps.parse.outputs.run_code == 'true'
      shell: bash
      env:
        SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
        SEMGREP_VERSION: ${{ inputs.semgrep-version }}
        REPORT_DIR: ${{ steps.parse.outputs.dir }}
      run: |
        set -uo pipefail
        pipx install "semgrep==${SEMGREP_VERSION}" >/dev/null
        # Findings are not a reason to stop — report.mjs is the gate.
        # If the install failed, no SARIF is written and the report catches it
        # as "scanner produced no report".
        semgrep scan --config "$SEMGREP_CONFIG" --sarif \
          --output "$REPORT_DIR/semgrep.sarif" --metrics off --quiet . || true

    - name: Setup Trivy
      if: steps.parse.outputs.run_vuln == 'true'
      uses: aquasecurity/setup-trivy@v0.3.1
      with:
        version: ${{ inputs.trivy-version }}
        cache: true

    - name: Vulnerability review — Trivy
      if: steps.parse.outputs.run_vuln == 'true'
      shell: bash
      env:
        REPORT_DIR: ${{ steps.parse.outputs.dir }}
      run: |
        set -uo pipefail
        trivy fs . --scanners vuln,misconfig --format sarif \
          --output "$REPORT_DIR/trivy.sarif" --exit-code 0 --quiet || true

    - name: Vulnerability review — Gitleaks
      if: steps.parse.outputs.run_vuln == 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.gitleaks-version }}
        REPORT_DIR: ${{ steps.parse.outputs.dir }}
      run: |
        set -uo pipefail
        tmp="$(mktemp -d)"
        base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
        tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
        curl -sSfL -o "$tmp/$tarball" "$base/$tarball" || { echo "::error::failed to download gitleaks v${VERSION}"; exit 1; }
        curl -sSfL -o "$tmp/checksums.txt" "$base/gitleaks_${VERSION}_checksums.txt" || { echo "::error::failed to download the gitleaks checksums"; exit 1; }
        # A binary from the internet: the checksum must be verified, and a
        # mismatch is fatal. awk matches the filename exactly; grep would treat
        # the dots in the tarball name as wildcards.
        want="$(awk -v f="$tarball" '$2 == f { print $1 }' "$tmp/checksums.txt")"
        [ -n "$want" ] || { echo "::error::no checksum for $tarball in the manifest"; exit 1; }
        ( cd "$tmp" && echo "$want  $tarball" | sha256sum -c - ) \
          || { echo "::error::gitleaks checksum mismatch"; exit 1; }
        tar -xzf "$tmp/$tarball" -C "$tmp" gitleaks
        # `dir` scans the working tree; the report is written outside the repo
        # so it does not get scanned itself on a later run.
        # --redact matters: without it the SARIF carries the raw secret, which
        # would then be copied into CI logs and any uploaded artifact. The file
        # and line are enough to locate it.
        "$tmp/gitleaks" dir . --report-format sarif --redact \
          --report-path "$REPORT_DIR/gitleaks.sarif" --exit-code 0 --no-banner || true

    - name: Commit message review — commitlint
      if: steps.parse.outputs.run_commit == 'true'
      shell: bash
      env:
        FROM: ${{ github.event.pull_request.base.sha }}
        TO: ${{ github.event.pull_request.head.sha }}
        REPORT_DIR: ${{ steps.parse.outputs.dir }}
        COMMITLINT_VERSION: ${{ inputs.commitlint-version }}
      run: |
        set -uo pipefail
        # Outside a pull_request context, check only the latest commit.
        from="${FROM:-$(git rev-parse HEAD~1 2>/dev/null || true)}"
        to="${TO:-HEAD}"

        # With no parent commit — a shallow checkout, or the very first commit —
        # commitlint refuses a --from that equals --to and prints its whole usage
        # text, which would land in the report as a bogus commit violation.
        # --last is what it asks for in that case.
        if [ -n "$from" ]; then
          range=(--from "$from" --to "$to")
        else
          range=(--last)
        fi

        # An unmatched glob stays a literal string, so -e is what decides.
        # `ls a b` cannot be used: it returns non-zero when either argument is
        # missing, which would override the user's own config with --extends.
        extends="--extends @commitlint/config-conventional"
        for f in commitlint.config.* .commitlintrc*; do
          if [ -e "$f" ]; then extends=""; break; fi
        done

        # npx --yes: never touches the consumer's package.json / node_modules.
        # Both packages share one version line upstream, so they take one pin.
        run_commitlint() {
          npx --yes --package "@commitlint/cli@$COMMITLINT_VERSION" \
            --package "@commitlint/config-conventional@$COMMITLINT_VERSION" -- \
            commitlint "$@"
        }
        # An install failure must surface as an error rather than masquerade as
        # a commit message violation inside commit.txt.
        run_commitlint --version >/dev/null 2>&1 \
          || { echo "::error::failed to install commitlint"; exit 1; }
        # commitlint exits 0 for warning-level rules while still printing them,
        # so its exit status is the verdict — not whether commit.txt has content.
        run_commitlint "${range[@]}" $extends > "$REPORT_DIR/commit.txt" 2>&1 \
          || touch "$REPORT_DIR/commit.failed"

    - name: Report
      if: ${{ always() && steps.parse.outputs.ok == 'true' }}
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        EXPECT: ${{ steps.parse.outputs.expect }}
        REPORT_DIR: ${{ steps.parse.outputs.dir }}
        SCOPE: ${{ inputs.scope }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        set -uo pipefail
        args=(--fail-on "$FAIL_ON" --expect "$EXPECT")
        # Scoping needs both ends of the PR range in the local clone, which is
        # what fetch-depth: 0 buys. Outside a pull request there is no range.
        # If the diff cannot be produced the report covers everything: hiding
        # findings on a failure would be the worst possible default here.
        if [ "$SCOPE" = changed ] && [ -n "$BASE" ] \
          && git diff --name-only "$BASE...$HEAD" > "$REPORT_DIR/changed.txt" 2>/dev/null; then
          args+=(--changed "$REPORT_DIR/changed.txt")
        else
          rm -f "$REPORT_DIR/changed.txt"
        fi
        node "$GITHUB_ACTION_PATH/scripts/report.mjs" "$REPORT_DIR" "${args[@]}"
