# Copy this to .github/workflows/review.yml in your project.
name: Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint inspects the PR's commit range, so it needs full history.
          # Safe to drop if you are not using the commit-message review.
          fetch-depth: 0

      - uses: supernurture/agnostic-pipeline-review@v1
        with:
          # Plug in / unplug reviews on this line.
          reviews: code,vulnerability,commit-message
          fail-on: high
