# Copy this to .github/workflows/review.yml in your project.
name: Review

on:
  pull_request:
    # For pull_request, `branches` filters the branch being merged *into*:
    # "review whatever is on its way into main". Drop it to review every PR.
    branches: [main]

permissions:
  contents: read
  # Only needed for pr-comment below. Drop it if you leave that off.
  pull-requests: write

jobs:
  review:
    # Linux only: the action uses pipx, tar and sha256sum.
    runs-on: ubuntu-latest
    # A composite action cannot time its own steps out, so the job has to; the
    # 6 hour default is no use for a stalled scanner install.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: commitlint needs the commit range, `scope` both ends
          # of the diff. Drop it only if you use neither.
          fetch-depth: 0

      - uses: supernurture/agnostic-pipeline-review@v1
        with:
          # Plug in / unplug reviews on this line.
          reviews: code,vulnerability,commit-message
          fail-on: high
          # Gate on the lines this PR touches; the rest is reported, not
          # dropped. Use `all` for the whole tree.
          scope: changed
          # One comment on the PR, rewritten each run.
          pr-comment: "true"
          # Downloadable report. A name, not a boolean: artifact names have to
          # be unique within a run.
          upload-artifact: review-report
