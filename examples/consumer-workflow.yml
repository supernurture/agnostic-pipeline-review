# Copy this to .github/workflows/review.yml in your project.
name: Review

on:
  pull_request:
    # For pull_request, `branches` filters the branch being merged *into*, so
    # this reads as "review whatever is on its way into main". GitHub has no
    # "protected branches" filter, so the names have to be spelled out.
    # Drop the `branches` line to review every PR.
    branches: [main]

permissions:
  contents: read
  # Only needed for pr-comment below. Drop it if you leave that off.
  pull-requests: write

jobs:
  review:
    # Linux only: the action uses pipx, tar and sha256sum.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: commitlint reads the PR's commit range, and `scope`
          # needs both ends of the diff. Safe to drop only if you use neither.
          fetch-depth: 0

      - uses: supernurture/agnostic-pipeline-review@v1
        with:
          # Plug in / unplug reviews on this line.
          reviews: code,vulnerability,commit-message
          fail-on: high
          # Gate on files this PR touches; everything else is reported, not
          # dropped. Use `all` to gate on the whole tree.
          scope: changed
          # One comment on the PR, rewritten each run, instead of only the
          # Job Summary.
          pr-comment: "true"
