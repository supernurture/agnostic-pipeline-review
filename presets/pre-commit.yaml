# Optional, for the local lane — copy this to .pre-commit-config.yaml in your
# project, then run `pre-commit install --install-hooks -t pre-commit -t commit-msg`.
#
# This is NOT the pipeline's source of truth. The severity-ranked report is
# produced in CI by the action; pre-commit here is only a fast pass/fail gate on
# a developer machine. Delete any block you do not use.

repos:
  # --- vulnerability review ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # --- code review ---
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.173.0
    hooks:
      - id: semgrep
        args: ["--config", "p/ci", "--error", "--skip-unknown-extensions"]

  # --- commit message review ---
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]
